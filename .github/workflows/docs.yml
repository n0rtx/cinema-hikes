name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0   # поставьте ту версию, что указана в TargetFramework

      - name: Restore tools and dependencies
        working-directory: CinemaHikes
        run: |
          dotnet tool restore
          dotnet restore src

      - name: Build docs
        working-directory: CinemaHikes
        run: dotnet docfx docs/docfx.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: CinemaHikes/docs/_site

      - id: deployment
        uses: actions/deploy-pages@v4